# MySQL DDL Commands – Practice Assignment

## 1. Assignment objective

Practice the following MySQL DDL commands using a sample database:

- \`CREATE\` – Create databases and tables.
- \`DROP\` – Delete databases or tables permanently.
- \`ALTER TABLE ADD\` – Add new columns.
- \`ALTER TABLE DROP COLUMN\` – Remove columns.
- \`ALTER TABLE MODIFY COLUMN\` – Change a column's data type or definition.
- \`ALTER TABLE RENAME TO\` – Rename a table.
- \`TRUNCATE\` – Remove all rows from a table while keeping its structure.

## 2. Example database and dataset

You are working as a database administrator for a college. The college wants to maintain student, course, and faculty information.

### Database: \`college_db\`

Create the following three tables.

### Table 1: students

| Column | Data type |
| --- | --- |
| student\_id | INT |

| age | INT |
| city | VARCHAR(30) |

### Table 3: faculty

| --- | --- |

| faculty\_name | VARCHAR(50) |

## 4. Setup script

sql

CREATE DATABASE college_db;

USE college_db;

CREATE TABLE students (
    student_id INT,
    student_name VARCHAR(50),
    age INT,
    city VARCHAR(30),
    fees DECIMAL(10,2)
);

CREATE TABLE courses (
    course_id INT,
    course_name VARCHAR(50),
    duration_months INT
);

CREATE TABLE faculty (
    faculty_id INT,

);

SHOW TABLES;

SELECT * FROM students;
SELECT * FROM courses;

\`\`\`

## 5. Assignment questions

Write the SQL query for each question. Try to solve them without looking up the syntax.

## Practice checklist

### A. CREATE

[ ]1. Create a database named training\_db.

[ ]2. Select training\_db as the current database.

[ ]3. Create a table named employees with emp\_id (INT), emp\_name (VARCHAR(60)), salary (DECIMAL(10,2)), and department (VARCHAR(40)).

[ ]4. Create a table named departments with dept\_id (INT) and dept\_name (VARCHAR(50)).

### B. ALTER TABLE — ADD

[ ]5. Add an email column of type VARCHAR(100) to the students table.

### G. DROP

## 6\. Challenge questions

These questions test whether you understand how DDL commands affect a database.

1. What is the difference between \`DROP\` and \`TRUNCATE\`?
2. Can you use \`ALTER TABLE ADD\` to add multiple columns in a single statement?
3. What happens to the data when you rename a table?
4. Which command removes a table's structure as well as its data?
5. How can you check the structure of a table after modifying it?


## 7\. Important MySQL notes

- \`DROP TABLE\` removes the table structure and its data.
- \`TRUNCATE TABLE\` removes all rows but keeps the table structure.
- \`ALTER TABLE ... MODIFY COLUMN\` changes a column definition.
- \`ALTER TABLE ... RENAME TO\` changes the table name.
- \`DESC table_name;\` displays the table structure.
- \`SHOW TABLES;\` lists tables in the selected database.

/* 1. Markdown pre-processing */
let md=markdownContent
  .replace(/^[ \t]*(sql|python|bash|sh|js|javascript|html|css|java|php|json|text)[ \t]*\n```[ \t]*\n/gim,'```$1\n')
  .replace(/^[ \t]*\[([ xX]?)\][ \t]*(?:\d+\.)?[ \t]*(\S.*)$/gm,(m,c,t)=>'- ['+(c.trim()?'x':' ')+'] '+t)
  .replace(/^(- \[[ x]\] .*)\n\n(?=- \[[ x]\] )/gm,'$1\n');

const root=$('#content');
root.innerHTML=marked.parse(md);

/* 2. Code blocks */
$$('pre code',root).forEach(c=>{
  hljs.highlightElement(c);
  const pre=c.parentElement;
  const lang=((c.className.match(/language-(\w+)/)||[])[1]||'code').toUpperCase();
  const win=el('div','win',
    '<div class="top"><i class="dot" style="background:#ff5f57"></i><i class="dot" style="background:#febc2e"></i><i class="dot" style="background:#28c840"></i><span class="lang">'+lang+'</span><button class="btn" type="button">'+ICON.copy+'<span>Copy</span></button></div>');
  pre.replaceWith(win);win.appendChild(pre);
  const b=$('button',win);
  b.onclick=async()=>{
    const txt=c.textContent;
    try{await navigator.clipboard.writeText(txt)}catch(e){const t=el('textarea');t.value=txt;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}
    $('span',b).textContent='Copied!';setTimeout(()=>$('span',b).textContent='Copy',1600);
  };
});

/* 3. Tables */
$$('table',root).forEach(t=>{const w=el('div','tw');t.replaceWith(w);w.appendChild(t)});

/* 4. Checklist */
const store=(()=>{const k='chk:'+($('h1',root)||{textContent:document.title}).textContent.trim();
  return{get:()=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}},
         set:v=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}}})();
const saved=store.get(), boxes=[];
$$('li > input[type=checkbox]',root).forEach((inp,i)=>{
  const li=inp.parentElement;inp.remove();
  li.parentElement.classList.add('tasks');
  const lab=el('label','task','<input type="checkbox"><span class="box">'+ICON.check+'</span><span class="num">'+(i+1)+'</span><span class="txt">'+li.innerHTML+'</span>');
  li.innerHTML='';li.appendChild(lab);
  const cb=$('input',lab);cb.checked=saved.includes(i);cb.onchange=update;boxes.push(cb);
});
$$('p',root).forEach(p=>{if(/^reset checklist$/i.test(p.textContent.trim()))p.remove()});
function update(){
  const done=boxes.filter(b=>b.checked).length,n=boxes.length,pc=n?Math.round(done/n*100):0;
  store.set(boxes.map((b,i)=>b.checked?i:-1).filter(i=>i>=0));
  $('#pTxt').textContent=done+' / '+n+' completed';
  $('#pPct').textContent=pc+'%';$('#pFill').style.width=pc+'%';
  $('#spTxt').textContent=done+' of '+n+' tasks done';$('#spFill').style.width=pc+'%';
}
function resetAll(){if(confirm('Clear all checked items?')){boxes.forEach(b=>b.checked=false);update()}}
if(boxes.length){
  $('#progress').hidden=false;$('#sp').hidden=false;
  $('#pReset').innerHTML=ICON.reset+'Reset checklist';
  $('#pReset').onclick=resetAll;update();
}

/* 5. Hero + section cards */
const kids=[...root.children];
root.innerHTML='';
const h1=kids.find(k=>k.tagName==='H1');
const title=h1?h1.innerHTML:document.title;
let card=null,secs=[],h3n=0;
root.appendChild(el('div','hero','<span class="badge">'+ICON.pencil+BADGE+'</span><div class="row"><div class="logo">'+ICON.db+'</div><h1>'+title+'</h1></div><div class="chips" id="chips"></div>'));
function mkCard(head){
  const n=secs.length,pal=PALETTE[n%PALETTE.length];
  card=el('section','card');card.id='s'+n;
  card.style.cssText='--c1:'+pal[0]+';--c2:'+pal[1]+';--g:'+pal[0]+'66';
  card.innerHTML=(head?'<header><span class="ico">'+iconFor(head.textContent)+'</span><h2>'+head.innerHTML+'</h2></header>':'')+'<div class="body"></div>';
  secs.push({id:card.id,title:head?head.textContent:'Overview',pal,subs:[]});root.appendChild(card);
}
kids.forEach(k=>{
  if(k===h1||k.tagName==='HR')return;
  if(k.tagName==='H2'){mkCard(k);return}
  if(!card)mkCard(null);
  if(k.tagName==='H3'){
    k.style.setProperty('--h',(265+h3n++*47)%360);
    const s=secs[secs.length-1];k.id=s.id+'-'+s.subs.length;s.subs.push({id:k.id,title:k.textContent});
  }
  $('.body',card).appendChild(k);
});
$('#chips').innerHTML=(boxes.length?'<span class="chip">'+boxes.length+' tasks</span>':'')+'<span class="chip">'+secs.length+' sections</span>';

/* 6. Challenge questions */
$$('.card',root).forEach((c,i)=>{
  if(!/challenge|quiz/i.test(secs[i].title))return;
  const ck='ch:'+secs[i].title,sv=(()=>{try{return JSON.parse(localStorage.getItem(ck))||[]}catch(e){return[]}})();
  const H='Think first, then click to mark as answered';
  $$('ol',c).forEach(ol=>{ol.classList.add('ch');
    const items=$$(':scope > li',ol);
    items.forEach((li,j)=>{
      li.innerHTML='<div class="q">'+li.innerHTML+'<span class="hint">'+H+'</span></div>';
      li.tabIndex=0;li.setAttribute('role','button');
      const set=on=>{li.classList.toggle('done',on);$('.hint',li).textContent=on?'Answered':H};
      set(sv.includes(j));
      const tg=()=>{set(!li.classList.contains('done'));
        try{localStorage.setItem(ck,JSON.stringify(items.map((x,n)=>x.classList.contains('done')?n:-1).filter(n=>n>=0)))}catch(e){}};
      li.onclick=e=>{if(e.target.tagName!=='CODE')tg()};
      li.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tg()}};
    });
  });
});

/* 7. Reset button at end of checklist card */
if(boxes.length){
  const b=el('button','btn reset',ICON.reset+'Reset checklist');b.type='button';b.onclick=resetAll;
  $('.body',boxes[boxes.length-1].closest('.card')).appendChild(b);
}

/* 8. Sidebar navigation */
$('#sLogo').innerHTML=ICON.db;
$('#sTitle').textContent=clean(h1?h1.textContent:document.title);
const toc=$('#toc');toc.appendChild(el('div','lbl','On this page'));
const items=secs.map(s=>{
  const d=el('div','ni');d.style.cssText='--c1:'+s.pal[0]+';--c2:'+s.pal[1]+';--g:'+s.pal[0]+'88';
  d.innerHTML='<a href="#'+s.id+'"><span class="ti">'+iconFor(s.title)+'</span><span>'+clean(s.title)+'</span></a>'+
    (s.subs.length?'<div class="sub">'+s.subs.map(x=>'<a href="#'+x.id+'">'+clean(x.title)+'</a>').join('')+'</div>':'');
  toc.appendChild(d);return d;
});
const setOn=i=>items.forEach((d,n)=>d.classList.toggle('on',n===i));
setOn(0);
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){const n=secs.findIndex(s=>s.id===e.target.id);setOn(n);items[n].scrollIntoView({block:'nearest'})}
}),{rootMargin:'-20% 0px -70% 0px'});
$$('.card',root).forEach(c=>io.observe(c));
// mobile drawer
$('#menu').innerHTML=ICON.menu;
$('#menu').onclick=()=>document.body.classList.toggle('nav');
$('#scrim').onclick=()=>document.body.classList.remove('nav');
toc.addEventListener('click',e=>{if(e.target.closest('a'))document.body.classList.remove('nav')});

/* 9. Back to top */
const top=$('#top');top.innerHTML=ICON.up;top.onclick=()=>scrollTo({top:0});
addEventListener('scroll',()=>top.classList.toggle('show',scrollY>400),{passive:true});

/* 10. Particles */
const cv=$('#fx'),ctx=cv.getContext('2d'),COLS=['#7c3aed','#ec4899','#06b6d4','#f59e0b','#10b981'];
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,P=[],mx=-999,my=-999;
function size(){
  const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
  const n=Math.min(70,Math.round(W*H/20000));
  P=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,r:1.6+Math.random()*3,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,c:COLS[Math.random()*COLS.length|0],a:.4+Math.random()*.5}));
}
function draw(){
  ctx.clearRect(0,0,W,H);
  for(const p of P){
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<-10)p.x=W+10;if(p.x>W+10)p.x=-10;if(p.y<-10)p.y=H+10;if(p.y>H+10)p.y=-10;
    const dx=p.x-mx,dy=p.y-my,d=Math.hypot(dx,dy);if(d<120&&d>0){p.x+=dx/d*1.4;p.y+=dy/d*1.4}
  }
  ctx.shadowBlur=0;ctx.lineWidth=1;
  for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){
    const d=Math.hypot(P[i].x-P[j].x,P[i].y-P[j].y);
    if(d<130){ctx.globalAlpha=(1-d/130)*.22;ctx.strokeStyle=P[i].c;ctx.beginPath();ctx.moveTo(P[i].x,P[i].y);ctx.lineTo(P[j].x,P[j].y);ctx.stroke()}
  }
  for(const p of P){ctx.globalAlpha=p.a;ctx.shadowColor=p.c;ctx.shadowBlur=16;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill()}
  ctx.globalAlpha=1;
}
function loop(){if(!document.hidden)draw();requestAnimationFrame(loop)}
size();addEventListener('resize',size);
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
still?draw():loop();

/* 11. Custom cursor (mouse devices only) */
if(!matchMedia('(hover: none)').matches){
  const cur=el('img','custom-cursor');cur.src=CURSOR_GIF;cur.alt='';document.body.appendChild(cur);
  addEventListener('mousemove',e=>{cur.style.display='block';cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px'});
  document.addEventListener('mouseleave',()=>cur.style.display='none');
}
})();
</script>
</body>
</html>
